name: ci

on:
  pull_request:
  push:
    branches: [main]

# Cancels in-flight runs on the same ref so a force-push or new
# commit doesn't burn runner minutes on a superseded commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: vet / test / smoke build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # ^ full commit SHA — pinned to defeat tag-mutation supply-chain attacks.
      # Bump via Dependabot/Renovate; never edit the SHA by hand on a whim.

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        # go-version-file reads the `go 1.26.4` directive from go.mod so the
        # runner's toolchain always matches what the project declares — no
        # drift between local dev and CI. `cache: true` re-uses the module
        # download cache across runs.
        with:
          go-version-file: go.mod
          cache: true

      # `go vet` is the cheapest static-check that catches the
      # obvious API misuse. `go test ./...` is the contract gate
      # today (`make check` is referenced in the project memory
      # but the file isn't on disk — see the build-binaries slice
      # notes; vet+test cover the equivalent for now). The smoke
      # build catches "tests pass but the shipping binary doesn't
      # compile" regressions.
      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: smoke build (linux/amd64)
        run: go build -trimpath -o /tmp/yactt ./cmd/yactt

      - name: upload smoke binary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yactt-smoke-${{ github.sha }}
          path: /tmp/yactt
          retention-days: 3
