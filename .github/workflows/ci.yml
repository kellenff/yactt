name: ci

on:
  pull_request:
  push:
    branches: [main]

# Cancels in-flight runs on the same ref so a force-push or new
# commit doesn't burn runner minutes on a superseded commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: vet / test / smoke build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # ^ full commit SHA — pinned to defeat tag-mutation supply-chain attacks.
      # Bump via Dependabot/Renovate; never edit the SHA by hand on a whim.

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        # go-version-file reads the `go 1.26.4` directive from go.mod so the
        # runner's toolchain always matches what the project declares — no
        # drift between local dev and CI. `cache: true` re-uses the module
        # download cache across runs.
        with:
          go-version-file: go.mod
          cache: true

      # `go vet` is the cheapest static-check that catches the
      # obvious API misuse. `go test ./...` is the contract gate
      # today (`make check` is referenced in the project memory
      # but the file isn't on disk — see the build-binaries slice
      # notes; vet+test cover the equivalent for now). The smoke
      # build catches "tests pass but the shipping binary doesn't
      # compile" regressions.
      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      # Supply-chain pin gate (Issue #1, mitigation #1).
      # `go mod verify` re-checks go.sum hashes against the on-disk module
      # cache — catches tampering or partial downloads. The grep refuses
      # `replace` directives, which can silently re-route a pinned dependency
      # to a fork. Tree-sitter grammars (`smacker/go-tree-sitter/{golang,
      # javascript, typescript/typescript}`) are pinned via pseudo-version
      # (`v0.0.0-YYYYMMDDHHMMSS-<commit>`) in go.mod — a commit hash, not a
      # float. The pseudo-version is the contract; CI fails if it is ever
      # loosened.
      - name: go mod verify (pin gate)
        run: |
          set -euo pipefail
          go mod verify
          if grep -E '^\s*replace\s' go.mod; then
            echo "::error::replace directives in go.mod are not permitted (supply-chain pin gate)" >&2
            exit 1
          fi

      - name: smoke build (linux/amd64)
        run: go build -trimpath -o /tmp/yactt ./cmd/yactt

  security:
    # Two gates on every PR:
    #   - govulncheck (Issue #1, mitigation #2): CVE detection on imported
    #     symbols. Offline query against the v1.24+ vuln DB embedded in the
    #     govulncheck binary.
    #   - gitleaks (Issue #4, mitigation #4b): committed-secret detection in
    #     the working tree. We download the gitleaks CLI tarball directly
    #     from the v8.18.4 GitHub release and verify it against the
    #     SHA256SUMS published on the same release — no third-party action
    #     wrapper, no Docker, ~3 MB download per run. The umbrella originally
    #     used gitleaks/gitleaks-action@v2.3.2; that wrapper had a URL-
    #     construction bug that 404'd on the binary tarball, and the
    #     rollback attributed it to "gitleaks upstream availability
    #     issues" — that was wrong. The CLI is reachable; bypassing the
    #     wrapper sidesteps the bug class entirely.
    #
    # GitHub Secret Scanning (repo settings → Code security and analysis)
    # remains enabled as a second layer for partner-pattern tokens.
    name: govulncheck + gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        # Pin to the v1.1.4 module tag (commit d1f380186385b4f64e00313f31743df8e4b89a77).
        # Go module tags are immutable — unlike action tags, v1.1.4 cannot be
        # moved to a different commit. `go install pkg@tag` resolves to the
        # tagged commit; we don't need a SHA here because the Go module proxy
        # already enforces a content-addressable download (the @tag is the
        # audit anchor).
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

      - name: gitleaks
        # ponytail: download gitleaks directly, skip the third-party
        # action wrapper whose URL construction previously 404'd.
        # Verify the tarball against the SHA256SUMS published alongside
        # the release (gitleaks upstream signs that file with cosign).
        env:
          GITLEAKS_VERSION: "8.18.4"
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          arch="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL --fail "${base}/${arch}"                                    -o "/tmp/${arch}"
          curl -sSL --fail "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o /tmp/SHA256SUMS
          ( cd /tmp && grep "linux_x64" SHA256SUMS | sha256sum -c - )
          tar -xzf "/tmp/${arch}" -C /tmp
          /tmp/gitleaks detect --source . --no-banner

      - name: upload smoke binary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yactt-smoke-${{ github.sha }}
          path: /tmp/yactt
          retention-days: 3
